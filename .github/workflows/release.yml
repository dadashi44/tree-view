# Публикация в npm по тегу вида v0.2.0.
#
# Токен не используется: доверие между npm и этим репозиторием установлено
# через OpenID Connect (Trusted Publisher). Раннер получает короткоживущий
# идентификатор от GitHub, npm его проверяет и разрешает публикацию — секрет
# NPM_TOKEN больше не нужен и не должен лежать в репозитории.
#
# Что настроено на стороне npm (по одному разу на каждый пакет):
#   Страница пакета → Settings → Trusted Publisher → GitHub Actions
#   Organization or user: dadashi44 · Repository: tree-view
#   Workflow filename: release.yml · Environment name: пусто
#   Allowed actions: включён «Allow npm publish»
#
# Если менять имя файла этого workflow — связь на npm придётся пересоздать:
# поля Trusted Publisher после создания не редактируются.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # Без этого GitHub не выдаст OIDC-токен, и публикация упадёт на авторизации.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Доверенная публикация появилась в npm 11.5.1, а с Node приезжает npm 10.
      # Мажор пинуем: npm@latest уже ушёл на 12, которому нужен ещё более свежий Node.
      - name: Свежий npm
        run: npm install -g npm@11

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка перед публикацией
        run: npm run verify

      # Порядок важен: пакеты ссылаются друг на друга,
      # зависимость должна попасть в реестр раньше зависящего.
      #
      # publish-if-new пропускает пакет, если такая версия уже опубликована,
      # поэтому повторный запуск прогона не падает на «cannot publish over».
      - name: Публикация core
        run: node scripts/publish-if-new.mjs core

      - name: Публикация Vue 3
        run: node scripts/publish-if-new.mjs vue3

      - name: Публикация Vue 2
        run: node scripts/publish-if-new.mjs vue2

      - name: Публикация Nuxt-модуля
        run: node scripts/publish-if-new.mjs nuxt
